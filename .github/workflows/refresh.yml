name: refresh-data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Live refresh
        run: python scripts/refresh_once.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild portable demo snapshot
        run: python scripts/build_demo.py

      - name: Commit refreshed data
        run: |
          set -euo pipefail
          git config user.name "mcp-explorer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the artefacts that actually exist on disk, so a missing
          # (or unchanged) file can never fail the run with a bad pathspec.
          for f in data/live_cache.json data/history.json data/changes.json \
                   static/data.snapshot.js demo.html; do
            if [ -f "$f" ]; then git add -- "$f"; else echo "skip (absent): $f"; fi
          done

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          # Commit FIRST, then fast-forward onto whatever main moved to while
          # we were fetching. (The old `git reset --hard origin/main` before
          # staging threw the whole refresh away.)
          git commit -m "chore(data): live refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git fetch origin main
          if ! git rebase origin/main; then
            echo "::warning::rebase onto origin/main conflicted; pushing as-is"
            git rebase --abort || true
          fi
          git push origin HEAD:main
