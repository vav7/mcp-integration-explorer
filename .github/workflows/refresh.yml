name: refresh-data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Live refresh
        run: python scripts/refresh_once.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild portable demo snapshot
        run: python scripts/build_demo.py

      - name: Commit refreshed data
        run: |
          git config user.name "mcp-explorer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git add data/live_cache.json data/history.json data/changes.json static/data.snapshot.js demo.html
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): live refresh $(date -u +%Y-%m-%dT%H:%MZ')"
            git push origin main
          fi
